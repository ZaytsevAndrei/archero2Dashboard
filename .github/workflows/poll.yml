name: Telegram poll & publish

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может задерживать)
  workflow_dispatch: {}      # ручной запуск из вкладки Actions
  push:
    branches: [main]         # каждый пуш тоже запускает опрос (страховка от молчания расписания)

# не даём двум опросам работать одновременно (иначе getUpdates конфликтует)
concurrency:
  group: telegram-poll
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ВАЖНО: имя шага в кавычках — внутри есть «OCR: tesseract/jimp»,
      # и голое двоеточие в YAML-значении ломает весь файл воркфлоу
      # (падение до создания джоб + расписание cron перестаёт срабатывать).
      - name: "Install deps (OCR: tesseract/jimp)"
        run: npm install --no-audit --no-fund

      - name: Poll Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: node scripts/poll.mjs

      - name: Commit new data
        run: |
          git config user.name  "damage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "Нет новых данных — нечего коммитить."
          else
            git commit -m "data: update from telegram bot"
            git pull --rebase origin main
            git push
          fi

      # Одноразовый шаг: включает GitHub Pages ( branch main / папка docs ),
      # если ещё не включён. Ошибка 409 (уже включён) — это норма.
      - name: Enable GitHub Pages (once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/{owner}/{repo}/pages \
            -f "source[branch]=main" -f "source[path]=/docs" \
            && echo "Pages включён" \
            || echo "Pages уже включён или включится вручную (Settings → Pages)"

      # Страховка от «залипшего» деплоя: явно запрашиваем пересборку Pages.
      # При branch-режиме каждый пуш и так пересобирает сайт, но если сборка
      # упала (например, из-за Jekyll), без этого шага прод застревает на старом.
      - name: Kick Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Конфигурация Pages:"
          gh api repos/{owner}/{repo}/pages --jq '.html_url + " | ветка: " + (.source.branch // "GitHub Actions режим")' || echo "Pages не настроен"
          gh api --method POST repos/{owner}/{repo}/pages/builds && echo "Пересборка Pages запрошена" || echo "Пересборку запросить не удалось (см. выше)"
